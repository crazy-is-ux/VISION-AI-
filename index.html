<!doctype html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#07090e"><title>VISION AI — Your intelligence</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f4f6fc;background:#07090e;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse 90% 45% at 50% 18%,#18243a 0%,#090c14 48%,#07090e 100%);overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.23;background-image:linear-gradient(#8aa2ce0c 1px,transparent 1px),linear-gradient(90deg,#8aa2ce0c 1px,transparent 1px);background-size:34px 34px}main{position:relative;max-width:780px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom)}header{display:flex;align-items:center;justify-content:space-between;padding:23px 0 16px;border-bottom:1px solid #ffffff16}.logo{font-size:17px;font-weight:700;letter-spacing:.29em}.logo span{color:#91a9d6}.status{font-size:10px;letter-spacing:.14em;color:#9faec7;display:flex;align-items:center;gap:7px}.status i{height:6px;width:6px;border-radius:50%;background:#75e8c0;box-shadow:0 0 12px #75e8c0}.hero{text-align:center;padding:35px 0 20px;transition:all .4s}.eyebrow{font-size:10px;letter-spacing:.32em;color:#a2b5d9;text-transform:uppercase}.core{width:180px;height:180px;margin:18px auto 23px;position:relative;display:grid;place-items:center;filter:drop-shadow(0 0 32px #577eff5c)}.core:before,.core:after{content:"";position:absolute;border:1px solid #99b8ff66;border-radius:50%;inset:18px;transform:rotate(-25deg) scaleX(.62);animation:spin 12s linear infinite}.core:after{inset:3px;border-color:#81b7ff45;transform:rotate(52deg) scaleX(.58);animation-duration:17s;animation-direction:reverse}.sphere{width:105px;height:105px;border-radius:50%;background:radial-gradient(circle at 28% 25%,#b9e4ff,#4778ed 25%,#172f75 56%,#050e2b 78%);box-shadow:inset -12px -15px 30px #020615,0 0 36px #4a80e888;animation:breathe 4s ease-in-out infinite;position:relative;overflow:hidden}.sphere:after{content:"";position:absolute;inset:17px -35px;border:1px solid #d5efffb0;border-radius:50%;transform:rotate(-35deg)}@keyframes spin{to{transform:rotate(335deg) scaleX(.62)}}@keyframes breathe{50%{transform:scale(1.08);filter:brightness(1.22)}}h1{font-size:clamp(27px,6vw,40px);letter-spacing:-.055em;font-weight:550;margin:0}h1 strong{font-weight:700;background:linear-gradient(100deg,#fff,#94b9ff);background-clip:text;color:transparent}.sub{color:#94a2b9;font-size:13px;line-height:1.6;margin:12px 0 0}.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:25px 0 0}.chip{border:1px solid #ffffff20;background:linear-gradient(145deg,#ffffff0e,#ffffff04);backdrop-filter:blur(18px);border-radius:15px;text-align:left;color:#dbe5f8;padding:14px 12px;font-size:12px;line-height:1.45;min-height:68px;cursor:pointer}.chip b{display:block;color:#a4c2ff;font-size:16px;margin-bottom:4px}.chat{flex:1;display:flex;flex-direction:column;gap:12px;overflow-y:auto;padding:12px 0 22px;min-height:90px}.bubble{max-width:87%;padding:14px 16px;border-radius:19px;font-size:14px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.user{align-self:flex-end;background:linear-gradient(130deg,#3d5da7,#263c76);border:1px solid #8aafff36;border-bottom-right-radius:5px}.bubble.ai{align-self:flex-start;background:#161d2bdc;border:1px solid #ffffff1a;border-bottom-left-radius:5px}.chat:not(:empty)~.hero{display:none}.composer-wrap{position:sticky;bottom:0;background:linear-gradient(transparent,#07090e 17%);padding:16px 0 10px}.composer{display:flex;align-items:center;gap:8px;padding:7px 7px 7px 17px;border:1px solid #ffffff30;border-radius:23px;background:#161d2aee;box-shadow:0 9px 40px #0008,0 0 25px #4676ef12}.composer:focus-within{border-color:#89aaf777}input{flex:1;min-width:0;border:0;outline:0;background:none;color:#fff;font-size:16px;padding:12px 0}input::placeholder{color:#8290a6}.send{width:43px;height:43px;border:0;border-radius:15px;background:linear-gradient(135deg,#b9d3ff,#5c86ed);color:#081126;font-size:21px;font-weight:700}.send:active{transform:scale(.94)}.footer{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 4px 4px;font-size:10px;color:#7d8ba3}.clear{border:0;background:none;color:#aab9d5;font-size:11px;padding:5px}.tag{font-size:10px;letter-spacing:.17em;color:#8298bd;border:1px solid #ffffff1b;padding:7px 10px;border-radius:99px}.compact .hero{padding:12px 0 4px}.compact .core{display:none}.compact h1{font-size:18px}.compact .sub,.compact .chips,.compact .eyebrow{display:none}@media(min-width:600px){.chips{max-width:520px;margin:30px auto 0}.hero{padding-top:65px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main id="app"><header><div class="logo">VISION <span>AI</span></div><div class="status"><i></i> PROTOTYPE 0.3</div></header><section class="hero" id="hero"><div class="eyebrow">THE NEXT INTERFACE</div><div class="core" aria-hidden="true"><div class="sphere"></div></div><h1>Intelligenz. <strong>Neu gedacht.</strong></h1><p class="sub">Ein Raum für Ideen, Fragen und Möglichkeiten.<br>Entwickelt für die nächste Generation.</p><div class="chips"><button class="chip" data-prompt="Hilf mir, meinen Tag zu planen"><b>↗</b>Meinen Tag planen</button><button class="chip" data-prompt="Ich habe eine neue Idee für VISION"><b>✧</b>Idee entwickeln</button><button class="chip" data-prompt="Erkläre mir ein schwieriges Thema einfach"><b>◇</b>Etwas verstehen</button><button class="chip" data-prompt="Was kannst du später alles können?"><b>◎</b>VISION entdecken</button></div></section><section id="chat" class="chat" aria-live="polite"></section><div class="composer-wrap"><form class="composer" id="form"><input id="input" aria-label="Nachricht an VISION AI" placeholder="Frag VISION AI ..." maxlength="2000" required autocomplete="off"><button class="send" aria-label="Nachricht senden" type="submit">↑</button></form><div class="footer"><span>LOKALER DEMO-MODUS · NOCH KEINE ECHTE KI</span><button class="clear" id="clear" type="button">Chat löschen</button></div></div></main><script>
const key='vision-ai-chat-v02',chat=document.getElementById('chat'),app=document.getElementById('app'),input=document.getElementById('input');let history=[];try{const data=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(data))history=data.filter(x=>x&&typeof x.text==='string'&&['user','ai'].includes(x.who)).slice(-100)}catch{}
function render(text,who,save=true){const node=document.createElement('div');node.className='bubble '+who;node.textContent=text;chat.appendChild(node);app.classList.add('compact');if(save){history.push({text,who});history=history.slice(-100);try{localStorage.setItem(key,JSON.stringify(history))}catch{}}requestAnimationFrame(()=>node.scrollIntoView({behavior:'smooth',block:'end'}))}
history.forEach(m=>render(m.text,m.who,false));
function send(text){text=text.trim();if(!text)return;render(text,'user');input.value='';setTimeout(()=>render('Deine Nachricht ist angekommen. ✦\n\nVISION AI 0.3 ist aktuell ein interaktiver Design-Prototyp. Die echte KI-Anbindung bauen wir als Nächstes ein.','ai'),450)}
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();send(input.value)});document.querySelectorAll('[data-prompt]').forEach(b=>b.addEventListener('click',()=>send(b.dataset.prompt)));document.getElementById('clear').addEventListener('click',()=>{if(confirm('Chatverlauf auf diesem Gerät löschen?')){history=[];localStorage.removeItem(key);chat.replaceChildren();app.classList.remove('compact')}})
</script></body></html>
