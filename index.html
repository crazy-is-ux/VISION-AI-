<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f5f7ff;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 25%,#1c2d4a 0%,#080b12 49%,#030405 100%);overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.15;background-image:linear-gradient(#9fbeef18 1px,transparent 1px),linear-gradient(90deg,#9fbeef18 1px,transparent 1px);background-size:48px 48px}main{position:relative;max-width:850px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom)}header{display:flex;align-items:center;justify-content:space-between;padding:20px 0 16px;border-bottom:1px solid #ffffff1c}.logo{font-size:18px;font-weight:800;letter-spacing:.27em;display:flex;align-items:center;gap:11px}.logo span{color:#a5c3ff}.logo .berry{width:28px;height:36px}.status{font-size:10px;letter-spacing:.13em;color:#afc0df;display:flex;align-items:center;gap:7px}.status i{height:6px;width:6px;border-radius:50%;background:#79efc8;box-shadow:0 0 12px #79efc8}.hero{text-align:center;padding:32px 0 18px;transition:all .35s}.eyebrow{font-size:10px;letter-spacing:.32em;color:#b0c4ea}.core{height:230px;margin:4px auto 15px;position:relative;display:grid;place-items:center;filter:drop-shadow(0 0 28px #6a91f966)}.core:before,.core:after{content:"";position:absolute;width:208px;height:208px;border:1px solid #a9caff4d;border-radius:50%;animation:spin 13s linear infinite}.core:after{width:170px;height:170px;transform:rotate(50deg) scaleX(.55);animation:spin2 10s linear infinite reverse}.core .berry{width:145px;height:177px;animation:float 5s ease-in-out infinite;z-index:2;filter:drop-shadow(0 0 18px #b2cfff66)}.sphere{display:none}@keyframes spin{to{transform:rotate(360deg)}}@keyframes spin2{to{transform:rotate(410deg) scaleX(.55)}}@keyframes float{50%{transform:translateY(-12px) rotate(3deg)}}h1{font-size:clamp(32px,6vw,50px);letter-spacing:-.06em;font-weight:600;margin:0}h1 strong{font-weight:700;background:linear-gradient(110deg,#fff,#92baff,#fff);background-clip:text;color:transparent}.sub{color:#a4b1c9;font-size:13px;line-height:1.65;margin:15px auto 0;max-width:370px}.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin:27px auto 0;max-width:650px}.chip{border:1px solid #b6c8ee32;background:linear-gradient(145deg,#ffffff19,#ffffff04);backdrop-filter:blur(18px);border-radius:18px;text-align:left;color:#e5eeff;padding:16px;font-size:13px;min-height:99px;cursor:pointer;transition:transform .2s,border-color .2s}.chip:hover{border-color:#b6d3ff88}.chip:active{transform:scale(.97)}.chip b{display:block;color:#bed5ff;font-size:24px;margin-bottom:9px}.chat{flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:15px 0 24px;min-height:70px}.bubble{max-width:87%;padding:15px 17px;border-radius:19px;line-height:1.6;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.ai{align-self:flex-start;background:linear-gradient(135deg,#202d40,#111923);border:1px solid #ffffff28;border-bottom-left-radius:5px}.bubble.user{align-self:flex-end;background:linear-gradient(135deg,#41649a,#233b63);border:1px solid #a4c5ff55;border-bottom-right-radius:5px}.composer-wrap{position:sticky;bottom:0;background:linear-gradient(transparent,#05070c 20%);padding:16px 0 10px}.composer{display:flex;gap:9px;padding:7px;border:1px solid #c4d7ff57;border-radius:22px;background:#172132f5;box-shadow:0 0 38px #6a9aff22,0 12px 30px #0008}.composer:focus-within{border-color:#bbd4ff}.composer input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font-size:16px;padding:12px}.composer input::placeholder{color:#96a5c0}.send{height:44px;width:44px;border:0;border-radius:15px;background:linear-gradient(135deg,#e3f0ff,#84aaf4);color:#0c1a33;font-size:24px}.footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 4px 4px;color:#8b9ab4;font-size:9px;letter-spacing:.07em}.clear{background:none;border:0;color:#c0cde6;font-size:11px}.tag{font-size:10px;color:#a4bde8}.compact .hero{padding:10px 0}.compact .core{height:90px}.compact .core .berry{height:74px;width:62px}.compact .core:before{width:85px;height:85px}.compact .core:after{width:65px;height:65px}.compact h1{font-size:19px}.compact .eyebrow,.compact .sub,.compact .chips{display:none}@media(min-width:650px){.chips{grid-template-columns:repeat(4,1fr)}.hero{padding-top:55px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main id="app"><header><div class="logo"><svg viewBox="0 0 120 150" class="berry" role="img" aria-label="VISION geometrisches Erdbeerlogo"><defs><linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".35" stop-color="#657b9f"/><stop offset=".63" stop-color="#e6f1ff"/><stop offset="1" stop-color="#1c2b48"/></linearGradient></defs><path d="M59 29 34 3 43 36 9 20 34 50 5 54 42 65 60 46 79 65 114 52 85 49 110 19 74 36 82 5Z" fill="url(#metal)" stroke="#e7f3ff"/><path d="M34 62 60 51 88 62 104 83 93 115 61 145 27 114 16 84Z" fill="#26334a" stroke="#b7d4ff" stroke-width="1.5"/><path d="M34 62 60 51 58 83 16 84Z" fill="#f2f8ff"/><path d="M60 51 88 62 104 83 58 83Z" fill="#8298b8"/><path d="M16 84 58 83 27 114Z" fill="#485a76"/><path d="M58 83 104 83 93 115Z" fill="#d0e3ff"/><path d="M27 114 58 83 61 145Z" fill="#8ca3c6"/><path d="M58 83 93 115 61 145Z" fill="#24344f"/></svg> VISION <span>AI</span></div><div class="status"><i></i> SIGNATURE 0.4</div></header><section class="hero" id="hero"><div class="eyebrow">A NEW ERA OF INTELLIGENCE</div><div class="core" aria-hidden="true"><svg viewBox="0 0 120 150" class="berry" role="img" aria-label="VISION geometrisches Erdbeerlogo"><defs><linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".35" stop-color="#657b9f"/><stop offset=".63" stop-color="#e6f1ff"/><stop offset="1" stop-color="#1c2b48"/></linearGradient></defs><path d="M59 29 34 3 43 36 9 20 34 50 5 54 42 65 60 46 79 65 114 52 85 49 110 19 74 36 82 5Z" fill="url(#metal)" stroke="#e7f3ff"/><path d="M34 62 60 51 88 62 104 83 93 115 61 145 27 114 16 84Z" fill="#26334a" stroke="#b7d4ff" stroke-width="1.5"/><path d="M34 62 60 51 58 83 16 84Z" fill="#f2f8ff"/><path d="M60 51 88 62 104 83 58 83Z" fill="#8298b8"/><path d="M16 84 58 83 27 114Z" fill="#485a76"/><path d="M58 83 104 83 93 115Z" fill="#d0e3ff"/><path d="M27 114 58 83 61 145Z" fill="#8ca3c6"/><path d="M58 83 93 115 61 145Z" fill="#24344f"/></svg></div><h1>Die Zukunft <strong>denkt mit.</strong></h1><p class="sub">Deine persönliche Intelligenz. Ein neuer Raum für Ideen, Wissen und Möglichkeiten.</p><div class="chips"><button class="chip" data-prompt="Hilf mir, meinen Tag zu planen"><b>↗</b>Meinen Tag planen</button><button class="chip" data-prompt="Ich habe eine neue Idee für VISION"><b>✧</b>Idee entwickeln</button><button class="chip" data-prompt="Erkläre mir ein schwieriges Thema einfach"><b>◇</b>Etwas verstehen</button><button class="chip" data-prompt="Was kannst du später alles können?"><b>◎</b>VISION entdecken</button></div></section><section id="chat" class="chat" aria-live="polite"></section><div class="composer-wrap"><form class="composer" id="form"><input id="input" aria-label="Nachricht an VISION AI" placeholder="Frag VISION AI ..." maxlength="2000" required autocomplete="off"><button class="send" aria-label="Nachricht senden" type="submit">↑</button></form><div class="footer"><span>VISION AI · SIGNATURE PROTOTYPE · NOCH KEINE ECHTE KI</span><button class="clear" id="clear" type="button">Chat löschen</button></div></div></main><script>
const key='vision-ai-chat-v02',chat=document.getElementById('chat'),app=document.getElementById('app'),input=document.getElementById('input');let history=[];try{const data=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(data))history=data.filter(x=>x&&typeof x.text==='string'&&['user','ai'].includes(x.who)).slice(-100)}catch{}
function render(text,who,save=true){const node=document.createElement('div');node.className='bubble '+who;node.textContent=text;chat.appendChild(node);app.classList.add('compact');if(save){history.push({text,who});history=history.slice(-100);try{localStorage.setItem(key,JSON.stringify(history))}catch{}}requestAnimationFrame(()=>node.scrollIntoView({behavior:'smooth',block:'end'}))}
history.forEach(m=>render(m.text,m.who,false));
function send(text){text=text.trim();if(!text)return;render(text,'user');input.value='';setTimeout(()=>render('Deine Nachricht ist angekommen. ✦\n\nVISION AI 0.4 ist aktuell ein interaktiver Design-Prototyp. Die echte KI-Anbindung bauen wir als Nächstes ein.','ai'),450)}
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();send(input.value)});document.querySelectorAll('[data-prompt]').forEach(b=>b.addEventListener('click',()=>send(b.dataset.prompt)));document.getElementById('clear').addEventListener('click',()=>{if(confirm('Chatverlauf auf diesem Gerät löschen?')){history=[];localStorage.removeItem(key);chat.replaceChildren();app.classList.remove('compact')}})
</script></body></html>
