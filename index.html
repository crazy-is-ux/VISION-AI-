<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b10"><title>VISION AI · 0.1</title>
<style>
:root{color-scheme:dark;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 20%,#16233c 0%,#090b10 50%);color:#f4f6fa;min-height:100dvh}main{max-width:760px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom)}header{display:flex;align-items:center;justify-content:space-between;padding:22px 0;border-bottom:1px solid #ffffff18}.brand{font-weight:800;letter-spacing:.18em}.version{color:#9da8ba;font-size:12px}.orb{width:100px;height:100px;border-radius:30%;background:radial-gradient(circle at 30% 20%,#b1d5ff,#436bff 35%,#15204d 70%);box-shadow:0 0 70px #426bff66;transform:rotate(-12deg);margin:35px auto 22px;animation:float 5s ease-in-out infinite}@keyframes float{50%{transform:translateY(-10px) rotate(12deg)}}h1{text-align:center;font-size:32px;margin:0}p.subtitle{text-align:center;color:#aeb8ca;margin:12px 0 25px}.messages{flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:10px 0 24px}.bubble{max-width:88%;padding:14px 16px;border-radius:18px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.ai{background:#192133;border:1px solid #ffffff18;align-self:flex-start}.user{background:#365cf1;align-self:flex-end}.composer{display:flex;gap:9px;padding:12px 0 20px}input{flex:1;min-width:0;background:#151b29;border:1px solid #ffffff2b;border-radius:17px;padding:15px;color:white;font-size:16px}button{border:0;border-radius:16px;padding:0 19px;background:#6f90ff;color:#071024;font-size:22px;font-weight:700}button:disabled{opacity:.4}.hint{color:#8290a7;text-align:center;font-size:11px;padding-bottom:12px}
</style></head><body><main><header><span class="brand">VISION <span style="color:#8daaff">AI</span></span><span class="version">PROTOTYP · v0.2</span><button id="clear" type="button" style="background:#232c3c;color:#e2e8f6;font-size:12px;padding:9px 12px">Chat löschen</button></header><div class="orb" aria-hidden="true"></div><h1>Was möchtest du wissen?</h1><p class="subtitle">Deine Ideen. Deine Zukunft. VISION.</p><section id="messages" class="messages" aria-live="polite"><div class="bubble ai">Willkommen bei VISION AI 0.2! 🍓<br><br>Deine Nachrichten bleiben auf diesem Gerät gespeichert. Eine echte KI-Anbindung folgt später.</div></section><form class="composer" id="form"><input id="message" placeholder="Nachricht an VISION ..." aria-label="Nachricht" maxlength="2000" required autocomplete="off"><button type="submit" aria-label="Senden">➜</button></form><div class="hint">Lokal gespeichert · Noch keine echte KI · Keine API-Schlüssel</div></main><script>
const form=document.querySelector('#form'),input=document.querySelector('#message'),messages=document.querySelector('#messages');
const key='vision-ai-chat-v02';let history=[];try{history=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(history))history=[];}catch{};function add(text,who,save=true){const el=document.createElement('div');el.className='bubble '+who;el.textContent=text;messages.appendChild(el);el.scrollIntoView({behavior:'smooth',block:'end'});if(save){history.push({text,who});try{localStorage.setItem(key,JSON.stringify(history.slice(-100)));}catch{}}}
history.slice(-100).forEach(m=>{if(m&&typeof m.text==='string'&&['ai','user'].includes(m.who))add(m.text,m.who,false)});document.querySelector('#clear').addEventListener('click',()=>{if(confirm('Gesamten Chat auf diesem Gerät löschen?')){history=[];localStorage.removeItem(key);messages.innerHTML='';add('Dein Chat wurde gelöscht. Wir können neu starten!','ai',false);}});form.addEventListener('submit',e=>{e.preventDefault();const text=input.value.trim();if(!text)return;add(text,'user');input.value='';setTimeout(()=>add('Ich habe deine Nachricht erhalten. In Version 0.1 bin ich eine Design-Demo. Als Nächstes verbinden wir mich sicher mit einem echten KI-Modell.','ai'),300);});
</script></body></html>
